[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "pixiv-bulk-downloader"
description = "Pixiv Bulk Downloader for bookmarks and works of following authors."
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "eggplants", email = "w10776e8w@yahoo.co.jp" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "gppt>=5,<6",
  "pixivpy3>=3.7.5",
]
urls.Repository = "https://github.com/eggplants/pixiv-bulk-downloader"
scripts.pbd = "pixiv_bulk_downloader.cli:main"

[dependency-groups]
dev = [
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt>=2.11.1",
  "pytest>=9.0.2",
  "pytest-cov>=7",
]
docs = [
  "pdoc>=16",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"
build.targets.wheel.packages = [ "pixiv_bulk_downloader" ]
build.targets.sdist.packages = [ "pixiv_bulk_downloader" ]

[tool.uv]
python-downloads = "never"
default-groups = [
  "dev",
  "docs",
]
exclude-newer = "P7D"
preview = true

[tool.ruff]
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",
  "D",
]
lint.per-file-ignores."packaging/entrypoint.py" = [
  "INP001", # Implicit namespace package (frozen entry point, not importable content)
]
lint.per-file-ignores."pixiv_bulk_downloader/console.py" = [
  "T201", # `print` found -- every line the tool prints goes through this module
]
lint.per-file-ignores."tests/**" = [
  "ANN",     # Missing type annotations (tests/fixtures)
  "ARG",     # Unused arguments (pytest fixtures, lambda stubs)
  "CPY001",  # Missing copyright notice
  "INP001",  # Implicit namespace package (no __init__ in tests)
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
  "S105",    # Hardcoded password (fake tokens)
  "S106",    # Hardcoded password argument (fake tokens)
  "S107",    # Hardcoded password default (fake tokens)
]
lint.allowed-confusables = [ "／" ]  # FULLWIDTH SOLIDUS, substituted for "/" in file names
lint.pydocstyle.convention = "google"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"
